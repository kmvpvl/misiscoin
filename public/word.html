<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="misiscoin.css"/>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="fetch.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
<script>
    var gamemap;
    var tguserid = window.Telegram.WebApp.initDataUnsafe.user.id;


    Telegram.WebApp.expand();
    const params = new URLSearchParams(document.location.search);
    function drawField() {
        if (!gamemap.field.secret) {
            $('my').hide();
            $('check').hide();
            $('body').addClass('notsecret');
            return
        }
        $('total').text(`Вы угадали: ${gamemap.field.stepCount}`);
        if (gamemap.field.myword == "") {
            $('my').show();
            $('check').hide();
        } else {
            $('my').hide();
            $('check').show();
            const checkStr = $('#checkword').val();
            $('stats').text(gamemap.stats.filter(el=>checkStr.includes(el[0])).map(el=>`${el[0]}: ${el[1]}`).join(", "));
            if ($('stats').text() == "") $('stats').text("Буквы не встречаются")
        }
    }
    $(document).ready(()=> {
        //setInterval(updateField, 3000);
        if (params.get("admin")) {
            //$('h1').append($('<select><option>БЭК-24-1</option><option>БЭК-24-2</option><option>БЭК-24-3</option><option>БЭК-24-4</option><option>БЭК-24-5</option><option>БЭК-24-6</option><option>БЭК-24-7</option><option>БТД-24-1</option></select>'));
            $('select').change(()=>updateField())
        }
        fetchCommand("gamewordgo", undefined, res=>{
            gamemap = res;
            drawField();
        }, err=>{

        });
        $('#myword').on('input', ()=> {
            $('#start').prop('disabled', !/^[а-я]{5,5}$/gm.test($('#myword').val()) )
        });
        $('#checkword').on('input', ()=> {
            $('#check').prop('disabled', !/^[а-я]{5,5}$/gm.test($('#checkword').val()) )
        })
        $('#start').on('click', ()=>{
            fetchCommand("gamewordgo", {myword: $('#myword').val()}, res=> {
                gamemap = res;
                drawField();
            })
        })
        $('#check').on('click', ()=>{
            fetchCommand("gamewordgo", {checkword: $('#checkword').val()}, res=> {
                gamemap = res;
                drawField();
            })
        })
    })
</script>
<style>
    * {
        box-sizing: border-box;
        --border: 1px solid black;
        --padding: 1px;
    }
    .notsecret {
        background-color: pink;
    }
    body, html {
        font-family: "UbuntuMono", monospace;
        min-height: 100%;
        max-height: 100%;
        min-width: 100%;
        max-width: 100%;
        overflow: hidden;
        width: 100%;
        height:100%;
        margin: 0;
        color: var(--tg-theme-text-color);
        background-color: var(--tg-theme-bg-color);
        padding: 5px;
        font-size: large;
    }
    content {
        min-height: 100%;
        max-height: 100%;
        min-width: 100%;
        max-width: 100%;
        overflow:hidden;
        width: 100%;
        height:100%;
        display: block;
        grid-template-rows: auto auto auto 1fr auto; /* 1fr auto;*/
    }

    my {
        display: none;
    }

    check {
        display: none;
    }

    word {
        font-size: 200%;
    }

    h2 {
        text-align: center;
    }
</style>
</head>
<body>
    <content>
    <h1>Слово<span></span></h1>
    <total></total>
    <my><input id="myword" placeholder="Введите свое слово тут..."><button id="start" disabled>Начать</button></my>
    <check><input id="checkword" placeholder="Введите слово для проверкитут..."><button id="check" disabled>Проверить</button></check>
    <h2>Встречаемость букв</h2>
    <stats></stats>
    </content> 
</body>
</html>
