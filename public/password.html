<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="misiscoin.css"/>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="fetch.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
<script>
    var gamemap;
    var tguserid = window.Telegram.WebApp.initDataUnsafe.user.id;

    Telegram.WebApp.expand();
    const params = new URLSearchParams(document.location.search);
    function draw() {
        let i = 0;
        do {
            $(`rule[tag="${i}"]`).show();
            i++;
        } while (i <= gamemap.gamer.rulestime.length);
    }
    $(document).ready(()=> {
        $('input').on('change input', event=>{
            const value = event.currentTarget.value;
            for (const el of $('rule[tag]')) {
                const ruleNumber = parseInt(el.attributes["tag"].value);
                if (checkRule(value, ruleNumber)) {
                    el.classList.add("correct");
                    if (gamemap.gamer.rulestime.length == ruleNumber) {
                        //checking for prev rules
                        const isAllPrevRulesOk = Array(ruleNumber).every((el, idx)=>checkRule(value, idx));
                        if (isAllPrevRulesOk) {
                            fetchCommand("gamepswgo", {ruleNumber: ruleNumber, psw: value}, res=>{
                                gamemap = res;
                                draw();
                            }, err=> {

                            });
                        }
                    }
                } else {
                    el.classList.remove("correct");
                }
            };
        });
        fetchCommand("gamepswinit", undefined, res=> {
            gamemap = res;
            draw();
        }, err=>{
            debugger
        })
    })
    function checkRule(value, rulenumber) {
        switch(rulenumber) {
            // не менее 8 символов
            case 0: return /.{8,}/gm.test(value);
    
            // хотя бы одна цифра
            case 1: return /\d/gm.test(value);

            // хотя бы одна прописная буква
            case 2: return /[A-ZА-Я]/gm.test(value);

            // хотя бы один спецсимвол
            case 3: return /[^\w\s]|_/gm.test(value);

            // ни один символ не должен повторяться
            case 4: return !/(.)(?:(?=(?:.*?\1){2})|(?=(?:(?!\1).)*(\1)(?!.*?\1)))/gm.test(value);

            // Хотя бы одна римская цифра
            case 5: return /[IVXLCMD]/gm.test(value);

            // Не менее двух цифр
            case 6: return /.*\d.*\d/gm.test(value)

            //цифра не может быть крайним символом
            case 7: return /^[^\d]/gm.test(value) && /[^\d]$/gm.test(value);
            default: return false;
        }
    }
</script>
<style>
    * {
        box-sizing: border-box;
        --border: 1px solid black;
        --padding: 1px;
    }
    body, html {
        font-family: "UbuntuMono", monospace;
        min-height: 100%;
        max-height: 100%;
        min-width: 100%;
        max-width: 100%;
        overflow: hidden;
        width: 100%;
        height:100%;
        margin: 0;
        color: var(--tg-theme-text-color);
        background-color: var(--tg-theme-bg-color);
        padding: 5px;
    }
    content {
        min-height: 100%;
        max-height: 100%;
        min-width: 100%;
        max-width: 100%;
        overflow:hidden;
        width: 100%;
        height:100%;
        display: grid;
        grid-template-rows: auto auto auto 1fr; /* 1fr auto;*/
    }
    rules {
        display: flex;
        overflow: auto;
        flex-direction: column;
    }
    rule {
        display: none;
    }
    rule:before {
        content: "X ";
        color: red;
    }
    rule.correct:before {
        content: 👌;
        color: green;
    }
    input {
        font-size: large;
    }
</style>
</head>
<body>
    <content>
    <h1>Пароль <span></span></h1>
    <total></total>
    <div><input placeholder="Введите пароль тут..."><input type="button" value="Проверить"></div>
    <rules>
        <rule tag="0">Не менее 8 символов</rule>
        <rule tag="1">Хотя бы одна цифра</rule>
        <rule tag="2">Хотя бы одна прописная буква</rule>
        <rule tag="3">Хотя бы один спецсимвол</rule>
        <rule tag="4">Ни один символ не должен повторяться</rule>
        <rule tag="5">Хотя бы одна римская цифра</rule>
        <rule tag="6">Не менее двух цифр</rule>
        <rule tag="7">Цифра не может быть крайним символом</rule>
        <rule tag="8">Не менее 8 символов</rule>
    </rules>
    </content> 
</body>
</html>
