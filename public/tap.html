<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="misiscoin.css"/>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="fetch.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
<script>
    var gamemap;
    var pendingScore = 0;
    var tguserid = window.Telegram.WebApp.initDataUnsafe.user.id;

    Telegram.WebApp.expand();
    const params = new URLSearchParams(document.location.search);
    function draw() {
        $('total').text(`Fixed score: ${gamemap.gamer.score + pendingScore}`);
    }
    $(document).ready(()=> {
        fetchCommand("gametapgo", {score: 0}, res=> {
            gamemap = res;
            draw();
        }, err=> {

        });
        $('button').on('click', ()=>{
            pendingScore++;
            draw();
        })
        setInterval(()=> {
            if (pendingScore > 0) {
                fetchCommand("gametapgo", {score: pendingScore}, res=> {
                    pendingScore = 0;
                    gamemap = res;
                    draw();
                }, err=> {

                });
            }
        }, 5000)
    })
</script>
<style>
    * {
        box-sizing: border-box;
        --border: 1px solid black;
        --padding: 1px;
    }
    body, html {
        font-family: "UbuntuMono", monospace;
        min-height: 100%;
        max-height: 100%;
        min-width: 100%;
        max-width: 100%;
        overflow: hidden;
        width: 100%;
        height:100%;
        margin: 0;
        color: var(--tg-theme-text-color);
        background-color: var(--tg-theme-bg-color);
        padding: 5px;
    }
    content {
        min-height: 100%;
        max-height: 100%;
        min-width: 100%;
        max-width: 100%;
        overflow:hidden;
        width: 100%;
        height:100%;
        display: grid;
        grid-template-rows: auto auto 1fr; /* 1fr auto;*/
    }
    button {
        width: 100%;
        height: 100%;
        text-align: center;
        font-size: xx-large;
    }
</style>
</head>
<body>
    <content>
    <h1>Beans tap<span></span></h1>
    <total></total>
    <button>TAP ME TENDER, TAP ME...</button>
    </content> 
</body>
</html>
