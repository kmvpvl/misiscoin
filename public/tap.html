<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="misiscoin.css"/>
<link rel="stylesheet" href="styles.css"> 

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="fetch.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
<script>
    var gamemap;
    var pendingScore = 0;
    var tguserid = window.Telegram.WebApp.initDataUnsafe.user.id;

    Telegram.WebApp.expand();
    const params = new URLSearchParams(document.location.search);
    function draw() {
        $('div.balance').text(`${gamemap.gamer.score + pendingScore}`);
    }
    $(document).ready(()=> {
        fetchCommand("gametapgo", {score: 0}, res=> {
            gamemap = res;
            draw();
        }, err=> {

        });
        $('img.main-image').on('click', ()=>{
            pendingScore++;
            draw();
        })
        setInterval(()=> {
            if (pendingScore > 0) {
                fetchCommand("gametapgo", {score: pendingScore}, res=> {
                    pendingScore = 0;
                    gamemap = res;
                    draw();
                }, err=> {

                });
            }
        }, 5000)
    })
</script>
<style>
    body, html { 
    height: 100%; 
    margin: 0; 
    display: flex; 
    justify-content: center; 
    align-items: flex-start; 
    background: linear-gradient(120deg, #00BFFF, #00008B); 
    font-family: Arial, sans-serif; 
} 
.container { 
    text-align: center; 
    width: 100%; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    padding: 20px; 
} 
.title { 
    background-color: #000080; 
    color: white; 
    padding: 5px 15px; 
    border-radius: 50px; 
    margin-bottom: 20px; 
    font-size: 14px; 
    font-weight: bold; 
    display: inline-block; 
} 
.balance-container { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    margin-bottom: 20px; 
} 
.balance { 
    font-size: 24px; 
    color: #fff; 
    font-weight: bold; 
    margin-right: 10px; 
} 
.balance-icon { 
    width: 40px; 
    height: 30px; 
} 
.main-image { 
    width: 180px;  
    height: auto; 
    margin-bottom: 20px; 
    cursor: pointer;
} 
.rewards-container { 
    background-color: rgb(0, 0, 0, 0.3); 
    padding: 10px;  
    border-radius: 10px; 
    max-width: 250px;
    display: flex; 
    flex-wrap: wrap; 
    justify-content: center; 
} 
.rewards { 
    display: flex; 
    justify-content: space-between; 
    width: 100%; 
} 
.reward { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    margin: 0 5px;  
} 
.reward img { 
    width: 55px;
    height: auto; 
} 
.reward-label { 
    font-size: 14px; 
    font-weight: bold; 
    color: #fff; 
    margin-top: 5px; 
    text-align: center;
} 
</style>
</head>
<body>
    <div class="container"> 
        <div class="title">BobTap</div> 
        <div class="balance-container"> 
            <div class="balance"></div> 
            <img src="https://a.imgfoto.host/2024/11/13/image_2024-11-12_22-25-51.png" alt="Bob" class="balance-icon"> 
        </div> 
        <img src="https://a.imgfoto.host/2024/11/18/image_2024-11-12_22-23-53-1.png" alt="image_2024-11-12_22-23-53-1.png" class="main-image"> 
        <div class="rewards-container"> 
            <div class="rewards"> 
                <div class="reward"> 
                    <img src="https://a.imgfoto.host/2024/11/13/image_2024-11-12_22-24-16.png" alt="Mine"> 
                    <div class="reward-label">Mine</div> 
                </div> 
                <div class="reward"> 
                    <img src="https://a.imgfoto.host/2024/11/13/image_2024-11-12_22-24-21.png" alt="Quests"> 
                    <div class="reward-label">Quests</div> 
                </div> 
                <div class="reward"> 
                    <img src="https://a.imgfoto.host/2024/11/13/image_2024-11-12_22-25-02.png" alt="Top"> 
                    <div class="reward-label">Top</div> 
                </div> 
            </div> 
        </div> 
    </div> 
</body>
</html>
